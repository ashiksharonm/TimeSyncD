name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions: {security-events: write, contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with: {languages: c-cpp, build-mode: manual}
      - run: make server_bin client_bin loadgen healthcheck metrics_reader
      - uses: github/codeql-action/analyze@v4
