# TimeSyncD configuration.  Command-line options override these.
mode = tcp                # tcp | udp
port = 9000
backend = auto            # auto (epoll on Linux, poll elsewhere) | epoll | poll
idle_sec = 30             # drop clients silent for this long (0 = never)
max_clients = 0           # 0 = limited only by file descriptors
backlog = 4096
metrics = on              # HTTP: /metrics (Prometheus), /metrics.json, /healthz
metrics_port = 9100
drift_max_clients = 100000   # per-client drift records kept (0 disables drift tracking)
drift_top = 20            # clients listed in /metrics.json, largest |drift| first
sndbuf = 0               # SO_SNDBUF per TCP connection in bytes (0 = OS default)
drain_ms = 2000           # on SIGTERM keep flushing queued replies for up to this long
shm = off                 # POSIX shared-memory telemetry for metrics_reader
